<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Display; src: url(../fonts/display.ttf); font-weight: 400 900; }
@font-face { font-family: UI; src: url(../fonts/ui.ttf); font-weight: 200 700; }
body{margin:0;background:#000}</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as H from '../lib/heraldry.js';
await document.fonts.load('700 30px Display'); await document.fonts.load('700 30px UI');
const c = document.getElementById('c').getContext('2d');
const P = H.PAL;
c.fillStyle = P.navy; c.fillRect(0,0,1920,1080);
H.guilloche(c, {cx: 330, cy: 300, R: 230, A: 30, B: 12, n: 14, m: 5, lines: 20, width: 1});
H.crest(c, 330, 330, 0.62, {}, {});
H.sovereign(c, 640, 40, 480, {});
c.fillStyle = P.crimson; c.fillRect(1150, 0, 770, 520);
for (let i = 0; i < 4; i++) H.soldier(c, 1230 + i*150, 480, 300, i*0.12, P.ink, i===3?'salute':'march');
H.soldierFront(c, 1830, 480, 260, 0.2, P.ink);
c.fillStyle = P.gold; c.fillRect(0, 560, 900, 520);
const top = H.bearer(c, 250, 1050, 300, P.ink, 0);
H.flag(c, top[0], top[1], 420, 250, 1.3, 1);
H.waxSeal(c, 1050, 800, 150, 4, 0);
H.insignia(c, 'wings', 1500, 640, 0.9);
H.insignia(c, 'anchor', 1350, 900, 0.7);
H.insignia(c, 'tower', 1650, 900, 0.7);
H.insignia(c, 'chevrons', 1820, 900, 0.5);
H.shipIcon(c, 1250, 640, 180, P.goldHi);
window.done = true;
</script></body></html>
